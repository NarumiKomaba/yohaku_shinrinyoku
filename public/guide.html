<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ガイドさん — 素材の登録</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/css/guide.css">
</head>
<body>
  <section id="login" hidden>
    <form id="login-form">
      <h1>ガイドさん</h1>
      <p class="hint">合言葉を入力してください。</p>
      <label class="field"><span>お名前（任意・素材に記録されます）</span><input id="guide-name" autocomplete="name"></label>
      <label class="field"><span>合言葉</span><input id="passcode" type="password" autocomplete="current-password" required></label>
      <p id="login-error" class="warn"></p>
      <button class="primary big" type="submit">ログイン</button>
    </form>
  </section>

  <div id="app" hidden>
    <header>
      <strong>ガイドさん</strong>
      <span class="spacer"></span>
      <a href="/admin.html">集計</a>
      <button id="logout" class="small ghost" type="button">ログアウト</button>
    </header>

    <main>
      <section id="tab-here" class="tab">
        <h2>ここで登録</h2>
        <div id="here-body"></div>
      </section>

      <section id="tab-map" class="tab" hidden>
        <div id="map-layout">
          <div id="map-col">
            <div class="toolbar">
              <button id="btn-add-mode" type="button">＋ Spot を追加</button>
              <button id="btn-osm" type="button">OSM 候補を取り込む</button>
              <button id="btn-locate" type="button">現在地</button>
              <button id="save-all" type="button" class="primary" disabled>未保存をすべて保存</button>
            </div>
            <div id="map"></div>
          </div>
          <aside id="side">
            <div id="cand-panel" hidden></div>
            <h3>Spot 一覧 <small id="spot-count"></small></h3>
            <ol id="spot-list"></ol>
            <div id="spot-form"><p class="hint">地図の Spot か一覧を選ぶと編集できます。</p></div>
          </aside>
        </div>
      </section>

      <section id="tab-walk" class="tab" hidden>
        <h2>録音ウォーク</h2>
        <div id="walk-body"></div>
      </section>
    </main>

    <nav>
      <button id="nav-here" type="button">ここで登録</button>
      <button id="nav-map" type="button">地図で編集</button>
      <button id="nav-walk" type="button">録音ウォーク</button>
    </nav>
  </div>

  <div id="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/js/guide.js"></script>
</body>
</html>
