<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>利用データ集計 — 皇居外苑版</title>
  <style>
    :root { --ink:#1f2a22; --muted:#5d6b60; --line:#d9d3c6; --accent:#2f5d3a; --bg:#f4f1ea; font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif; }
    body { margin:0; padding:20px; background:var(--bg); color:var(--ink); }
    main { max-width:1100px; margin:0 auto; }
    h1 { font-size:1.2rem; margin:0 0 4px; }
    .meta { color:var(--muted); font-size:.85rem; margin:0 0 16px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
    section { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 16px; }
    section h2 { font-size:.95rem; margin:0 0 8px; color:var(--accent); }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    td { padding:4px 0; border-bottom:1px solid #eee; vertical-align:top; }
    td:last-child { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; padding-left:12px; }
    .wide { grid-column:1/-1; }
    .refl td { text-align:left !important; white-space:normal !important; }
    button { font:inherit; border-radius:8px; border:1px solid var(--accent); background:#fff; color:var(--accent); padding:6px 12px; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Phase 1 利用データ集計</h1>
    <p class="meta" id="meta"></p>
    <p><button id="reload">更新</button> <a href="/guide.html">ガイドさんページ</a> <button id="logout" hidden>ログアウト</button></p>
    <form id="login" hidden><p>ガイドさんの合言葉を入力してください。</p><input id="passcode" type="password" autocomplete="current-password" required> <button>ログイン</button> <span id="login-error"></span></form>
    <div class="cards" id="cards"></div>
  </main>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
